<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ichimoku Mobile Trainer</title><style>body{font-family:Arial;background:#0e1117;color:#e6edf3;margin:0;padding:10px}.card{background:#161b22;padding:12px;border-radius:10px}button{width:100%;margin:6px 0;padding:14px;border:none;border-radius:8px;font-size:16px}.long{background:#238636;color:white}.short{background:#da3633;color:white}.skip{background:#6e7681;color:white}.choiceRow{display:flex;gap:6px}.choiceRow button{flex:1;background:#222;color:#ccc;font-size:14px}.active{background:#f59e0b !important;color:black !important}canvas{width:100%;height:42vh;background:#090c10;border-radius:8px;margin-bottom:10px}.feedback{margin-top:10px;padding:10px;background:#090c10;border-radius:8px;font-size:13px;line-height:1.6}.score{margin-top:10px;font-size:14px;color:#aaa}</style></head><body><h3>Ichimoku Trainer</h3><input type="file" id="csvFile" accept=".csv"><br><br><div id="app"></div><script>let data=[],points=[],i=0;let selections={env:null,state:null};let score={dir:0,env:0,state:0,total:0};function parseCSV(t){return t.trim().split('\n').map(r=>r.split('\t'))}function toObj(r){return r.map(x=>({date:x[0],open:+x[1],high:+x[2],low:+x[3],close:+x[4]}))}function pickPoints(){points=[];for(let j=0;j<5;j++){points.push(Math.floor(Math.random()*(data.length-60))+52)}}function highest(arr,n){return Math.max(...arr.slice(-n).map(d=>d.high))}function lowest(arr,n){return Math.min(...arr.slice(-n).map(d=>d.low))}function calcIchimoku(series){let tenkan=[],kijun=[],spanA=[],spanB=[];for(let k=0;k<series.length;k++){let sub=series.slice(0,k+1);if(sub.length>=9){tenkan.push((highest(sub,9)+lowest(sub,9))/2)}else tenkan.push(null);if(sub.length>=26){kijun.push((highest(sub,26)+lowest(sub,26))/2)}else kijun.push(null);if(tenkan[k]!=null && kijun[k]!=null){spanA.push((tenkan[k]+kijun[k])/2)}else spanA.push(null);if(sub.length>=52){spanB.push((highest(sub,52)+lowest(sub,52))/2)}else spanB.push(null);}return {tenkan,kijun,spanA,spanB};}function classifyEnv(price, spanA, spanB){if(spanA==null || spanB==null)return "Unknown";let top=Math.max(spanA,spanB);let bot=Math.min(spanA,spanB);if(price>top)return "Above";if(price<bot)return "Below";return "Inside";}function classifyState(series){let last3=series.slice(-3);let highs=last3.map(d=>d.high);let lows=last3.map(d=>d.low);if(highs[2]>highs[1] && highs[1]>highs[0] && lows[2]>lows[1] && lows[1]>lows[0])return "Trend";if(highs[2]<highs[1] && lows[2]>lows[1])return "Pullback";return "Transition";}function draw(){let p=points[i];let ctxData=data.slice(p-60,p+1);let visible=ctxData.slice(-20);let testIndex=visible.length-1;let html=`<div class='card'>`;html+=`<canvas id='c'></canvas>`;html+=`<div><b>Environment</b></div>`;html+=`<div class='choiceRow'><button onclick="setEnv('Above')">Above</button><button onclick="setEnv('Inside')">Inside</button><button onclick="setEnv('Below')">Below</button></div>`;html+=`<div><b>State</b></div>`;html+=`<div class='choiceRow'><button onclick="setState('Trend')">Trend</button><button onclick="setState('Pullback')">Pullback</button><button onclick="setState('Transition')">Transition</button></div>`;html+=`<div><b>Trade</b></div>`;html+=`<button class='long' onclick="answer('Long')">▲ LONG</button>`;html+=`<button class='short' onclick="answer('Short')">▼ SHORT</button>`;html+=`<button class='skip' onclick="answer('No Trade')">— NO TRADE</button>`;html+=`<div id='res' class='feedback'></div>`;html+=`<div id='score' class='score'></div>`;html+=`</div>`;document.getElementById('app').innerHTML=html;let c=document.getElementById('c');let g=c.getContext('2d');c.width=c.offsetWidth;c.height=c.offsetHeight;let prices=visible.flatMap(x=>[x.high,x.low]);let lo=Math.min(...prices),hi=Math.max(...prices);function y(p){return c.height-(p-lo)/(hi-lo)*c.height}let ichi=calcIchimoku(ctxData);let offset=ctxData.length-visible.length;for(let k=1;k<visible.length;k++){let a=ichi.spanA[k+offset];let b=ichi.spanB[k+offset];if(a && b){g.fillStyle=a>b?'rgba(74,222,128,0.15)':'rgba(248,113,113,0.15)';let x1=(k-1)*(c.width/visible.length);let x2=k*(c.width/visible.length);g.beginPath();g.moveTo(x1,y(a));g.lineTo(x2,y(ichi.spanA[k+offset]));g.lineTo(x2,y(ichi.spanB[k+offset]));g.lineTo(x1,y(b));g.closePath();g.fill();}}visible.forEach((d,idx)=>{let x=idx*(c.width/visible.length)+5;let col=d.close>=d.open?'#26a69a':'#ef5350';if(idx===testIndex)col='#f59e0b';g.strokeStyle=col;g.beginPath();g.moveTo(x,y(d.high));g.lineTo(x,y(d.low));g.stroke();g.fillStyle=col;let top=y(Math.max(d.open,d.close));let bot=y(Math.min(d.open,d.close));g.fillRect(x-3,top,6,bot-top||2);});}function setEnv(v){selections.env=v;highlight()}function setState(v){selections.state=v;highlight()}function highlight(){document.querySelectorAll('.choiceRow button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.choiceRow')[0].querySelectorAll('button').forEach(b=>{if(b.innerText===selections.env)b.classList.add('active')});document.querySelectorAll('.choiceRow')[1].querySelectorAll('button').forEach(b=>{if(b.innerText===selections.state)b.classList.add('active')});}function answer(choice){let p=points[i];let ctxData=data.slice(p-60,p+1);let visible=ctxData.slice(-20);let ichi=calcIchimoku(ctxData);let offset=ctxData.length-visible.length;let testIdx=visible.length-1;let actualEnv=classifyEnv(visible[testIdx].close, ichi.spanA[testIdx+offset], ichi.spanB[testIdx+offset]);let actualState=classifyState(visible);let next=data[p+1];let cur=data[p];let actualDir=next.close>cur.close?'Long':'Short';let dirCorrect=(choice===actualDir);let envCorrect=(selections.env===actualEnv);let stateCorrect=(selections.state===actualState);if(dirCorrect)score.dir++;if(envCorrect)score.env++;if(stateCorrect)score.state++;score.total++;let res=document.getElementById('res');res.innerHTML=`<b>Result</b><br>Trade: ${choice} vs ${actualDir} ${dirCorrect?'✅':'❌'}<br>Env: ${selections.env} vs ${actualEnv} ${envCorrect?'✅':'❌'}<br>State: ${selections.state} vs ${actualState} ${stateCorrect?'✅':'❌'}<br><hr><b>Feedback</b><br>${!envCorrect?`Environment misread → You saw ${selections.env}, market was ${actualEnv}<br>`:''}${!stateCorrect?`State misread → You saw ${selections.state}, market was ${actualState}<br>`:''}${!dirCorrect?`Trade misaligned with structure<br>`:''}`;let sc=document.getElementById('score');sc.innerHTML=`Score → Dir: ${score.dir}/${score.total} | Env: ${score.env}/${score.total} | State: ${score.state}/${score.total}`;setTimeout(()=>{i++;if(i<points.length){selections={env:null,state:null};draw()}else{document.getElementById('app').innerHTML='<h2>Done</h2>'}},2500);}document.getElementById('csvFile').addEventListener('change',e=>{let r=new FileReader();r.onload=x=>{let rows=parseCSV(x.target.result);rows.shift();data=toObj(rows);pickPoints();draw();};r.readAsText(e.target.files[0]);});</script></body></html>
